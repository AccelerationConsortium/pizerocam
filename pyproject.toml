[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pizerocam"
version = "2.0.0"
description='PiCamera unit (HTTP photo/stream/light server) and client for self-driving labs'
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "netifaces>=0.11.0"
]

# More at https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: MIT",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
]

authors = [
    {name = "Yang Cao", email = "cyrilcaoyang@gmail.com"}
]

[project.optional-dependencies]
server = [
    "picamera2",
    "adafruit-circuitpython-neopixel",
]
client = [
    "opencv-python>=4.5.0,<5.0.0",
    "numpy>=1.21.0,<2.0.0",
    "pillow>=13.0.0",
    "matplotlib",
    "google-cloud-vision",
    "python-dotenv"
]
client-tesseract = [
    "opencv-python>=4.5.0,<5.0.0",
    "numpy>=1.21.0,<2.0.0",
    "pillow>=13.0.0",
    "pytesseract==0.3.13",
    "matplotlib",
    "python-dotenv"
]

[project.scripts]
pizerocam-client = "image_req_client.cli:main_client"
pizerocam-server = "image_server.cli:main_server"

[tool.setuptools]
packages = ["image_req_client", "image_server"]
py-modules = ["logger"]

[tool.setuptools.package-data]
image_server = ["server_settings.yaml"]

[tool.setuptools.package-dir]
"" = "src"
